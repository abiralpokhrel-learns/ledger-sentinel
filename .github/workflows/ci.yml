name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: pip install pytest ruff
      - run: ruff check app/ tests/ || true
      - run: python data/generate_synthetic_data.py
      - run: python -m app.main
      - run: pytest tests/ -q
      - run: python -m py_compile app/main.py dashboard/app.py
      - name: docker build smoke
        run: docker build -t ledger-sentinel:ci .
