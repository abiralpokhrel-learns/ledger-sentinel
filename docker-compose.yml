services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      LEDGER_DB_PATH: /data/ledger_sentinel.db
      PYTHONPATH: .
    volumes:
      - ledger_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      LEDGER_DB_PATH: /data/ledger_sentinel.db
      PYTHONPATH: .
    volumes:
      - ledger_data:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  ledger_data:
